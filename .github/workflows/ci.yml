 name: CI

 on: [push, pull_request]

 jobs:
   test:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v3

       - name: Setup Python
         uses: actions/setup-python@v4
         with:
           python-version: "3.14"

       - name: Install deps
         run: |
           pip install -r requirements.txt
           pip install pytest

       - name: Run tests
         run: pytest -q
