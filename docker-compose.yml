 version: "3.9"

 services:
   api:
     build: .
     command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
     volumes:
       - .:/app
     ports:
       - "8000:8000"
     depends_on:
       - redis

   worker:
     build: .
     command: python -m app.workers.worker
     depends_on:
       - redis
     volumes:
       - .:/app

   redis:
     image: redis:7
     ports:
       - "6379:6379"
